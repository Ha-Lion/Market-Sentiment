// A39: Read the classified headline breakdown from published records only.
// Headline totals are not the same as sentiment category totals; never substitute one for the other.
function a39CountBreakdown(entry){
 if(!entry||typeof entry!=='object')return null;
 const direct=[entry,entry.sentiment_counts,entry.classification_counts,entry.sentiment_breakdown,
   entry.classifications,entry.headline_sentiment_counts,entry.counts,entry.sentiment];

 for(const obj of direct){
  if(!obj||typeof obj!=='object'||Array.isArray(obj))continue;
  const bull=pick(obj,['bullish_count','bull_count','bullish','bull','positive_count','positive']);
  const bear=pick(obj,['bearish_count','bear_count','bearish','bear','negative_count','negative']);
  const neutral=pick(obj,['neutral_count','neutral']);
  const mixed=pick(obj,['mixed_count','mixed']);
  const combined=pick(obj,['neutral_mixed_count','neutral_or_mixed_count','neutral_mixed']);
  if(bull===null||bear===null)continue;
  const neutralTotal=neutral!==null&&mixed!==null?neutral+mixed:(combined!==null?combined:(mixed===null?neutral:null));
  if(neutralTotal===null)continue;
  const vals=[bull,bear,neutralTotal];
  const total=entry.headline_count??entry.count??entry.total_headlines??entry.total_count??obj.total??obj.headlines;
  if(total!==undefined&&total!==null&&Number.isFinite(Number(total))&&vals.reduce((a,b)=>a+b,0)!==Number(total))continue;
  return vals;
 }
 // Limited sample arrays must not be presented as complete headline classifications.
 const rows=entry.headlines||entry.top_headlines;
 const count=entry.headline_count??entry.count??entry.total_headlines??entry.total_count;
 if(!Array.isArray(rows)||!Number.isSafeInteger(count)||rows.length!==count)return null;
 const vals=[0,0,0];
 for(const row of rows){
  const label=String(row?.classification??row?.sentiment_label??row?.sentiment_class??row?.vote??row?.sentiment??'').toLowerCase().trim();
  if(['bullish','bull','positive'].includes(label))vals[0]++;
  else if(['bearish','bear','negative'].includes(label))vals[1]++;
  else if(['neutral','mixed','neutral/mixed','neutral_mixed'].includes(label))vals[2]++;

 }

}

const A68_LAYOUTS_KEY='psd-dashboard-named-layouts-v1';

function a68ReadLayouts(){
 try {
  const value=JSON.parse(localStorage.getItem(A68_LAYOUTS_KEY)||'[]');
  return Array.isArray(value)?value.filter(x=>x&&typeof x.name==='string'&&Array.isArray(x.tiles)).slice(0,A68_LAYOUTS_MAX):[];

function a68WriteLayouts(records){

// V89: Authenticator preference applies to the PSD account, not individual provider logins.
function v89AuthPreferences(){
 open('My Preferences · Account Security',`<div class="v88-form">
 <div class="v88-section"><h4>Google Authenticator for Public Sentiment Dash</h4><p class="notice">Set this up once for your PSD account. Then use the same authenticator entry to verify PSD access before connecting any supported social network. Individual providers may still require their own login or additional verification.</p><div class="v88-status">Status: Not linked in this lab preview</div></div>
 <div class="v88-section"><h4>How to register</h4><ol class="notice"><li>Install Google Authenticator on your phone (or another TOTP-compatible app).</li><li>Sign in to your Public Sentiment Dash account.</li><li>Open My Preferences → Account Security → Set up Authenticator.</li><li>Scan the enrollment QR code with the app, or manually enter the secret supplied by the secure PSD server.</li><li>Enter the six-digit code shown in the app to activate protection.</li><li>Keep recovery codes in a safe place if they are provided by the service.</li></ol><p class="notice">The secure enrollment service is not connected in this standalone HTML. No functional QR code or secret can be provided yet.</p></div>
 <div class="v88-section"><h4>Enrollment</h4><div class="v88-fields"><label class="field">Enrollment QR code / secret<input disabled value="Pending secure Supabase enrollment"></label><label class="field">Six-digit code<input disabled inputmode="numeric" placeholder="Available after enrollment"></label></div><div class="v88-actions"><button class="btn accent" disabled>Activate Google Authenticator</button><button class="btn" id="v89GoogleHelp">Google Authenticator setup help ↗</button></div></div>
 </div>`,`<button class="btn" id="v89BackSettings">Back to Settings</button>`);
 $('#v89GoogleHelp').onclick=()=>window.open('https://support.google.com/accounts/answer/1066447','_blank','noopener,noreferrer');
 $('#v89BackSettings').onclick=()=>settingsMenu();
}
function v87ShowDisclosure(name){
 if(!SOCIAL.some(([n])=>n===name))return;
 const label=v87NetworkLabel(name);
 const paras=[
 ['Third-party relationship',`${label} is independently operated and is not controlled, endorsed, secured or warranted by Public Sentiment Dash LLC (PSD). Its own policies, availability and account security apply.`],
 ['Permission and account access','Connections require provider-authorized integration and explicit approval of permissions. PSD must never collect third-party passwords.'],
 ['Information and privacy','The final policy must disclose account data collected, why it is used, where it is retained, how it can be removed, and how providers process it.'],
 ['Security responsibilities','Users should secure their accounts and devices. PSD must maintain reasonable, legally required protections for its systems and data.'],
 ['Third-party risks','Providers may change or discontinue features, restrict access, suffer outages or compromise, and display incorrect or unsuitable information.'],
 ['Market information','Social posts and market information are not investment advice and need independent verification.'],
 ['Limitations of liability','Subject to applicable law, appropriate disclaimers and limits of liability will apply only as stated in the final attorney-reviewed Terms of Service. No disclaimer can exclude non-waivable rights or obligations.'],
 ['Disconnection','Users should be able to disconnect authorized integrations and revoke provider access, subject to provider requirements.'],
 ['Legal status','Development draft only. Final legal terms, policy versions and account-bound evidence of informed acceptance need production implementation.']
 ];
 open(label+' · Terms & Conditions',`<div class="v44-terms">${paras.map(([h,p])=>`<p><strong>${safe(h)}</strong></p><p>${safe(p)}</p>`).join('')}</div><p class="notice">Terms should be presented once, only after a verified first PSD sign-in. Acceptance must be stored securely against the authenticated user and policy version. This standalone lab cannot verify that event or record binding consent.</p>`,`<button class="btn accent" id="v89CloseTerms">Back to ${safe(label)}</button>`);
 $('#v89CloseTerms').onclick=()=>v86StartNetwork(name);
}
