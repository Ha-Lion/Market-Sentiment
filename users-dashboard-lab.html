const HISTORY_KEY='psd-users-dashboard-v11-history';
let history=[];try{const data=JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]');if(Array.isArray(data))history=data.filter(x=>x&&Number.isFinite(Date.parse(x.time))&&x.values&&typeof x.values==='object').slice(-120)}catch{}
function recordSnapshot(d){
 const time=d.generatedAt,values={};
 for(const [asset,v] of Object.entries(d.instruments||{})){
   let daily=v.psi?.daily;
   if(psiValue(daily)!==null)values[asset]=daily.value;
 }
 if(!Object.keys(values).length)return;
 const existing=history.findIndex(x=>x.time===time);
 const item={time,values};if(existing>=0)history[existing]=item;else history.push(item);
 history.sort((a,b)=>Date.parse(a.time)-Date.parse(b.time));history=history.slice(-120);
 try{localStorage.setItem(HISTORY_KEY,JSON.stringify(history))}catch{}
}
function plot(a,kind){
 const points=history.map(x=>({time:Date.parse(x.time),value:x.values[a]}))
  .filter(x=>Number.isFinite(x.time)&&typeof x.value==='number'&&Number.isFinite(x.value)&&x.value>=0&&x.value<=100)
  .sort((x,y)=>x.time-y.time);
 if(points.length<2)return `<div class="notice">Historical PSI chart will appear after at least two valid, timestamped snapshots are imported for ${safe(a)}.</div>`;
 const min=points[0].time,max=points[points.length-1].time;
 if(min===max)return `<div class="notice">Import snapshots from different times to see a trend.</div>`;
 const x=t=>40+(t-min)/(max-min)*365, y=v=>148-v*1.22;
 const poly=points.map(p=>`${x(p.time).toFixed(1)},${y(p.value).toFixed(1)}`).join(' ');
 const grid=[0,25,50,75,100].map(v=>`<line x1="40" y1="${y(v)}" x2="408" y2="${y(v)}" stroke="currentColor" opacity=".12"/><text x="4" y="${y(v)+4}" fill="currentColor" font-size="11">${v}</text>`).join('');
 return `<svg class="graph" viewBox="0 0 420 170" role="img" aria-label="Imported daily PSI history for ${safe(a)}; ${points.length} readings"><g>${grid}</g><polyline fill="none" stroke="#72b7ff" stroke-width="2.8" points="${poly}"/>${points.map(p=>`<circle cx="${x(p.time).toFixed(1)}" cy="${y(p.value).toFixed(1)}" r="3.7" fill="#e7b65e"><title>${new Date(p.time).toLocaleString()}: ${p.value} PSI</title></circle>`).join('')}</svg>`;
}

function consent(name,url){const valid=SOCIAL.find(x=>x[0]===name);const link=valid?valid[1]:url;try{if(new URL(link).protocol!=='https:')return}catch{return}if(state.consent[name+'|'+link]){window.open(link,'_blank','noopener,noreferrer');return}open(`External Service: ${name}`,`<div class="important">You are leaving Public Sentiment Dash for ${safe(name)}. The external provider controls its login, account data, privacy practices and terms. Your credentials must be entered only on that provider’s official website. Public Sentiment Dash does not store them. External sites may not permit embedding, message counts or data access without authorized integration.</div><label class="option" style="margin-top:14px"><input id="agree" type="checkbox"> I understand and agree to open this third-party service under its own terms and privacy policy.</label>`,`<button class="btn accent" id="agreeOpen" disabled>Agree & Open</button>`);$('#agree').onchange=e=>$('#agreeOpen').disabled=!e.target.checked;$('#agreeOpen').onclick=()=>{state.consent[name+'|'+link]=true;persist();window.open(link,'_blank','noopener,noreferrer');shut()}}
function tileSettings(t){open(`Tile Settings · ${t.title}`,`<label class="field">Display name<input id="tileTitle" maxlength="60" value="${safe(t.title)}"></label><div class="two"><label class="field">Width (px)<input type="number" min="145" max="1250" id="tileWidth" value="${t.w}"></label><label class="field">Height (px)<input type="number" min="80" max="800" id="tileHeight" value="${t.h}"></label></div><p class="notice">${t.type==='technical'?'Use Technical Indicators settings to select measurements.':t.type==='fundamental'?'Use Fundamental Drivers settings to select indicators.':'Data feeds are pending connection.'}</p>`,`<button class="btn accent" id="saveTile">Save Tile</button>`);$('#saveTile').onclick=()=>{t.title=$('#tileTitle').value.trim()||t.title;t.w=Math.max(145,Math.min(1250,Number($('#tileWidth').value)||t.w));t.h=Math.max(80,Math.min(800,Number($('#tileHeight').value)||t.h));shut();render()}}
board.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let t=tiles.find(x=>x.id===b.closest('.tile')?.dataset.id);if(b.dataset.asset){state.selected=b.dataset.asset;render();return}if(b.hasAttribute('data-asset'))return;if(b.dataset.open){pane(b.dataset.open);return}if(b.dataset.social){const s=SOCIAL.find(x=>x[0]===b.dataset.social);if(s)consent(s[0],s[1]);return}if(b.dataset.external){window.open(b.dataset.external,'_blank','noopener,noreferrer');return}if(!t)return;switch(b.dataset.command){case'lock':t.locked=!t.locked;break;case'config':tileSettings(t);return;case'min':t.min=!t.min;t.maxed=false;break;case'max':t.maxed=!t.maxed;t.min=false;break;case'close':t.closed=true;break}render()});
board.addEventListener('pointerdown',e=>{if(e.button!==0||e.target.closest('button,input,select,a'))return;const el=e.target.closest('.tile');if(!el)return;const t=tiles.find(x=>x.id===el.dataset.id);if(!t||t.locked||t.maxed)return;const handle=e.target.closest('.handle'),bar=e.target.closest('.bar');if(!handle&&!bar)return;e.preventDefault();const scale=Math.min(1,(Math.max(1200,board.clientWidth)-24)/1370),sx=e.clientX,sy=e.clientY,ox=t.x,oy=t.y,ow=t.w,oh=t.h;el.style.zIndex=String(t.z=++Z);el.setPointerCapture(e.pointerId);let id=e.pointerId;const move=ev=>{if(ev.pointerId!==id)return;let dx=(ev.clientX-sx)/scale,dy=(ev.clientY-sy)/scale;if(handle){t.w=Math.max(145,Math.min(1250,ow+dx));t.h=Math.max(80,Math.min(800,oh+dy));el.style.width=t.w*scale+'px';el.style.height=t.h*scale+'px'}else{t.x=Math.max(0,ox+dx);t.y=Math.max(0,oy+dy);el.style.left=t.x*scale+'px';el.style.top=t.y*scale+'px'}};const done=ev=>{if(ev.pointerId!==id)return;el.removeEventListener('pointermove',move);el.removeEventListener('pointerup',done);el.removeEventListener('pointercancel',done);board.style.minHeight=Math.max(1100,...tiles.map(x=>(x.y+x.h)*scale+30))+'px';persist()};el.addEventListener('pointermove',move);el.addEventListener('pointerup',done);el.addEventListener('pointercancel',done)});
modal.addEventListener('click',e=>{const st=e.target.closest('[data-star]'),rd=e.target.closest('[data-read]'),op=e.target.closest('[data-open]'),soc=e.target.closest('[data-social]');if(st){state.star[st.dataset.star]=state.star[st.dataset.star]?false:Date.now();pane('news')}if(rd){state.read[rd.dataset.read]=Date.now();pane('news')}if(op)pane(op.dataset.open);if(soc){let s=SOCIAL.find(x=>x[0]===soc.dataset.social);if(s)consent(s[0],s[1])}});
$('#backup').onclick=()=>{const copy={schema:1,exportedAt:new Date().toISOString(),dashboard:{...state,tiles}};const blob=new Blob([JSON.stringify(copy,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='users-dashboard-layout-v11.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)};
$('#importLayout').onclick=()=>$('#importFile').click();
document.getElementById('modalBody').addEventListener('click',e=>{const trigger=e.target.closest('[data-v9-action]');if(!trigger)return;const id=trigger.dataset.v9Action;if(id==='undoArrange'&&$('#undoArrange').disabled){alert('No arrangement to undo yet.');return;}shut();$('#'+id)?.click();});
$('#importFile').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{if(f.size>2000000)throw Error('File exceeds 2 MB');const input=JSON.parse(await f.text());if(input.schema!==1||!input.dashboard||!Array.isArray(input.dashboard.tiles)||!Array.isArray(input.dashboard.watch))throw Error('Invalid dashboard backup');const d=input.dashboard;if(d.tiles.length>100||d.watch.length>15||d.tech?.length>15)throw Error('Invalid dashboard size');const validTiles=d.tiles.every(t=>t&&typeof t.id==='string'&&typeof t.title==='string'&&typeof t.type==='string'&&['x','y','w','h'].every(k=>Number.isFinite(t[k])&&t[k]>=0&&t[k]<5000));if(!validTiles)throw Error('Invalid tile positions');const permitted=new Set([...blueprint.map(x=>x[0]),...tiles.map(x=>x.id)]);if(d.tiles.some(t=>!permitted.has(t.id)&&!/^custom[0-9]+$/.test(t.id)))throw Error('Unexpected tile identifiers');const cleaned={...structuredClone(defaults),selected:ASSETS.includes(d.selected)?d.selected:'EUR/USD',watch:d.watch.filter(x=>x===null||ASSETS.includes(x)).slice(0,15),tech:Array.isArray(d.tech)?d.tech.filter(x=>TECH.includes(x)).slice(0,10):defaults.tech,sources:Array.isArray(d.sources)?d.sources.filter(x=>SOURCES.includes(x)):defaults.sources,fund:{},consent:{},read:{},star:{},settings:{},techByAsset:{},tiles:d.tiles.map(t=>({id:t.id.slice(0,80),title:t.title.slice(0,60),type:t.type,x:t.x,y:t.y,w:Math.max(145,t.w),h:Math.max(80,t.h),locked:!!t.locked,closed:!!t.closed,min:!!t.min,maxed:!!t.maxed}))};if(d.fund&&typeof d.fund==='object')for(const [asset,values]of Object.entries(d.fund))if(ASSETS.includes(asset)&&Array.isArray(values))cleaned.fund[asset]=values.filter(x=>FUNDS.includes(x)).slice(0,6);if(d.techByAsset&&typeof d.techByAsset==='object')for(const [asset,values] of Object.entries(d.techByAsset))if(ASSETS.includes(asset)&&Array.isArray(values))cleaned.techByAsset[asset]=[...new Set(values.filter(x=>TECH.includes(x)))].slice(0,10);if(d.settings?.notifications&&Array.isArray(d.settings.notifications))cleaned.settings.notifications=d.settings.notifications.filter(x=>typeof x==='string').slice(0,10);if(!confirm('Replace this lab dashboard layout with the imported backup?'))return;localStorage.setItem(KEY,JSON.stringify(cleaned));location.reload()}catch(err){alert('Cannot import: '+err.message)}finally{e.target.value=''}};
$('#importData').onclick=()=>$('#dataFile').click();$('#dataHealth').onclick=healthPane;$('#templateData').onclick=downloadTemplate;
$('#clearData').onclick=()=>{if(!confirm('Clear imported market snapshot from this browser?'))return;snap=null;localStorage.removeItem(SNAP_KEY);render()};
$('#dataFile').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{if(f.size>1024*1024)throw Error('Snapshot exceeds 1 MB');let d=JSON.parse(await f.text());if(!d||d.schema!==1||!ageOK(d.generatedAt,48)||typeof d.instruments!=='object'||!d.instruments||Array.isArray(d.instruments))throw Error('Invalid or outdated snapshot');let output={schema:1,generatedAt:d.generatedAt,instruments:{},regions:{}};for(let [a,v] of Object.entries(d.instruments)){if(!ASSETS.includes(a)||!v||typeof v!=='object')continue;let entry={psi:{},technical:{},fundamentals:{}};for(const period of ['daily','weekly','monthly']){let o=v.psi?.[period];if(psiValue(o)!==null)entry.psi[period]={value:o.value,evidenceAt:o.evidenceAt}}for(const name of TECH){let o=v.technical?.[name];if(dataPoint(o)!==null)entry.technical[name]={value:o.value,asOf:o.asOf}}for(const name of FUNDS){let o=v.fundamentals?.[name];if(dataPoint(o,168)!==null)entry.fundamentals[name]={value:o.value,asOf:o.asOf}}output.instruments[a]=entry}for(const id of ['global','us','euro']){let o=d.regions?.[id];if(psiValue(o)!==null)output.regions[id]={value:o.value,evidenceAt:o.evidenceAt}}if(!Object.keys(output.instruments).length&&!Object.keys(output.regions).length)throw Error('No supported valid data points (timestamps and PSI evidence required)');snap=output;localStorage.setItem(SNAP_KEY,JSON.stringify(output));recordSnapshot(output);render();alert('Snapshot imported. Valid recent data displays; missing or stale data remains blank.')}catch(err){alert('Import rejected: '+err.message)}finally{e.target.value=''}};
$('#settingsMain').onclick=settingsMenu;$('#addTile').onclick=()=>{let i=tiles.length;tiles.push({id:'custom'+Date.now(),title:'Custom Workspace',type:'custom',x:245+(i%4)*55,y:590+(i%3)*40,w:300,h:200,locked:false,min:false,maxed:false,closed:false});render()};$('#restore').onclick=()=>{tiles.forEach(t=>t.closed=false);render()};$('#unlock').onclick=()=>{tiles.forEach(t=>t.locked=false);render()};$('#reset').onclick=()=>{if(confirm('Reset ALL lab data, tile positions and settings?')){localStorage.removeItem(KEY);location.reload()}};window.addEventListener('resize',render);
// V9: Website owns color theme. Compact spacing remains optional under Settings.
const APPEARANCE_KEY='psd-dashboard-v7-appearance';
let appearance={compact:false};try{appearance.compact=JSON.parse(localStorage.getItem(APPEARANCE_KEY)||'{}').compact===true}catch{}
function applyAppearance(){document.documentElement.dataset.density=appearance.compact?'compact':'normal';const t=$('#densityToggle');if(t){t.textContent='Compact spacing: '+(appearance.compact?'On':'Off');t.setAttribute('aria-pressed',String(appearance.compact))}}
$('#densityToggle').onclick=()=>{appearance.compact=!appearance.compact;localStorage.setItem(APPEARANCE_KEY,JSON.stringify({compact:appearance.compact}));applyAppearance()};
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.classList.contains('open'))shut()});
// V8: quick switch, measured data freshness, reversible tile arrangement.
let previousArrangement=null;
function refreshQuickAsset(){
 const select=$('#v8Asset');const options=state.watch.filter(x=>typeof x==='string'&&ASSETS.includes(x));
 select.innerHTML=options.length?options.map(x=>`<option value="${safe(x)}">${safe(x)}</option>`).join(''):'<option value="">No watchlist assets</option>';
 select.value=options.includes(state.selected)?state.selected:(options[0]||'');
}
function refreshV8Status(){
 refreshQuickAsset();
 const label=$('#v8Connection'),psi=$('#v8PSI');
 if(!snap){label.textContent='Demo mode · No snapshot';label.dataset.quality='stale';psi.textContent='PSI: not imported';psi.dataset.quality='stale';return;}
 const recent=ageOK(snap.generatedAt,48);const ps=snapshotAsset(state.selected).psi||{};
 const good=['daily','weekly','monthly'].filter(k=>recent&&psiValue(ps[k])!==null).length;
 label.textContent=recent?'Local snapshot · Recent timestamp':'Local snapshot · Expired';label.dataset.quality=recent?'valid':'stale';
 psi.textContent=`${state.selected}: ${good}/3 PSI periods valid`;psi.dataset.quality=good?'valid':'stale';
}
$('#v8Asset').addEventListener('change',e=>{if(ASSETS.includes(e.target.value)){state.selected=e.target.value;render();refreshV8Status()}});
$('#v8Refresh').onclick=()=>{render();refreshV8Status();};
$('#autoArrange').onclick=()=>{
 const movable=tiles.filter(t=>!t.closed&&!t.locked&&!t.maxed);
 if(!movable.length){alert('No movable tiles. Unlock at least one tile.');return;}
 if(!confirm(`Arrange ${movable.length} unlocked tiles? Locked tiles will remain in place.`))return;
 previousArrangement=tiles.map(t=>({id:t.id,x:t.x,y:t.y,w:t.w,h:t.h}));
 // Keep locked tiles in place; pack unlocked tiles below their reserved area to avoid overlaps.
 const fixed=tiles.filter(t=>!t.closed&&(t.locked||t.maxed));
 const startY=fixed.length?Math.max(...fixed.map(t=>t.y+t.h))+24:10;
 const columns=[10,350,690,1030];let col=0,y=startY,rowHeight=0;
 for(const t of movable){const width=Math.min(325,Math.max(220,t.w));const height=Math.max(140,t.min?85:t.h);
   if(col===4){col=0;y+=rowHeight+14;rowHeight=0;}
   t.x=columns[col++];t.y=y;t.w=width;rowHeight=Math.max(rowHeight,height);
 }
 $('#undoArrange').disabled=false;render();refreshV8Status();
};
$('#undoArrange').onclick=()=>{if(!previousArrangement)return;for(const old of previousArrangement){let t=tiles.find(x=>x.id===old.id);if(t)Object.assign(t,{x:old.x,y:old.y,w:old.w,h:old.h})}previousArrangement=null;$('#undoArrange').disabled=true;render();refreshV8Status();};
// Observe successful changes from existing controls without altering their behavior.
const boardObserver=new MutationObserver(()=>{if(!board.dataset.v8RefreshPending){board.dataset.v8RefreshPending='1';queueMicrotask(()=>{delete board.dataset.v8RefreshPending;refreshV8Status()})}});
boardObserver.observe(board,{childList:true});
// Re-evaluate imported timestamps while this tab remains open, including after tab focus.
setInterval(()=>{if(snap){render();refreshV8Status()}},60000);
window.addEventListener('focus',()=>{if(snap){render();refreshV8Status()}});
applyAppearance();
render();
refreshV8Status();

// V12 watermark keeps the source image colors intact; local-only file, no upload to any server.
const LOGO_KEY='psd-users-dashboard-logo-v12';
function applyWatermark(){
  try{const item=JSON.parse(localStorage.getItem(LOGO_KEY)||'null');
    const v=item?.data;
    if(typeof v==='string'&&/^data:image\/(png|jpeg|webp|gif);base64,[A-Za-z0-9+/=]+$/.test(v)){
      board.style.setProperty('--psd-watermark-image','url("'+v+'")');document.documentElement.style.setProperty('--psd-watermark-image','url("'+v+'")');
      document.documentElement.style.setProperty('--watermark-opacity',String(Math.min(.3,Math.max(.04,Number(item.opacity)||.11))));
    }else {board.style.removeProperty('--psd-watermark-image');document.documentElement.style.removeProperty('--psd-watermark-image');}
  }catch{board.style.removeProperty('--psd-watermark-image');document.documentElement.style.removeProperty('--psd-watermark-image')}
}
function logoSettings(){
  let saved=null;try{saved=JSON.parse(localStorage.getItem(LOGO_KEY)||'null')}catch{}
  const opacity=Math.round(100*(saved?.opacity||.11));
  open('Logo Watermark',`<p class="notice">Choose your original Public Sentiment Dash logo. Its colors will be preserved; only transparency changes. The image is stored in this browser, not uploaded to a server.</p><label class="field">Logo image (PNG, JPG or WebP; maximum 400 KB)<input id="v12LogoFile" type="file" accept="image/png,image/jpeg,image/webp"></label><label class="field">Watermark visibility: <strong id="v12LogoPercent">${opacity}%</strong><input id="v12LogoOpacity" type="range" min="4" max="30" value="${opacity}"></label><p class="notice" id="v12LogoState">${saved?.data?'Custom logo saved in this browser.':'No logo selected yet.'}</p>`,`<button class="btn" id="v12RemoveLogo">Remove watermark</button><button class="btn accent" id="v12SaveLogo">Save</button>`);
  const file=$('#v12LogoFile'),slider=$('#v12LogoOpacity');let pending=saved?.data||null;
  slider.oninput=()=>{$('#v12LogoPercent').textContent=slider.value+'%'};
  file.onchange=async()=>{const f=file.files?.[0];if(!f)return;if(!['image/png','image/jpeg','image/webp'].includes(f.type)||f.size>400000){alert('Please select a PNG, JPG or WebP under 400 KB.');file.value='';return}const uri=await new Promise((resolve,reject)=>{let reader=new FileReader;reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(f)});pending=uri;$('#v12LogoState').textContent='Logo selected. Save to apply the watermark.'};
  $('#v12SaveLogo').onclick=()=>{if(!pending){alert('Choose your original logo image first.');return}try{localStorage.setItem(LOGO_KEY,JSON.stringify({data:pending,opacity:Number(slider.value)/100}));applyWatermark();shut()}catch{alert('Browser storage limit reached. Try a smaller image.')}};
  $('#v12RemoveLogo').onclick=()=>{localStorage.removeItem(LOGO_KEY);applyWatermark();shut()};
}
document.getElementById('modalBody').addEventListener('click',e=>{if(e.target.closest('[data-v12-watermark]'))logoSettings()});
applyWatermark();

})();
