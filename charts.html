<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Public Sentiment Dash — Market Charts</title>
  <meta name="description" content="Use Public Sentiment Dash Market Charts for quick technical context across indices, forex, commodities, stocks, and crypto using embedded TradingView charts.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://publicsentimentdash.com/charts.html">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="stylesheet" href="site.css">
  <link rel="stylesheet" href="site-theme.css">

  <style>
    :root{
      --bg:#e8eef5;
      --card:#ffffff;
      --card2:#f2f6fa;
      --line:#a9bed0;
      --text:#061522;
      --muted:#365067;
      --gold:#8b5e00;
      --gold2:#6b4700;
      --shadow:rgba(25,50,72,.15);
      --chart-bg:#ffffff;
      --chart-grid:rgba(71,85,105,.16);
    }

    body.dark-mode{
      --bg:#070b12;
      --card:#0d131d;
      --card2:#111927;
      --line:rgba(148,163,184,.30);
      --text:#f8fbff;
      --muted:#c7d4e5;
      --gold:#d29922;
      --gold2:#f4d17d;
      --shadow:rgba(0,0,0,.24);
      --chart-bg:#0d131d;
      --chart-grid:rgba(148,163,184,.12);
    }

    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
    }

    .charts-wrap{
      max-width:1880px;
      margin:0 auto;
      padding:10px;
    }

    .charts-hero{
      display:flex;
      justify-content:space-between;
      align-items:flex-end;
      gap:14px;
      padding:10px 14px;
      margin-bottom:8px;
      border:1px solid var(--line);
      border-radius:17px;
      background:var(--card);
      box-shadow:0 14px 34px var(--shadow);
    }

    .charts-hero h1{
      margin:0 0 4px;
      font-size:clamp(28px,2.4vw,40px);
      line-height:1;
      letter-spacing:-.03em;
      font-weight:800;
    }

    .charts-hero p{
      margin:0;
      color:var(--muted);
      font-size:13px;
      line-height:1.35;
      max-width:900px;
    }

    .provider-pill{
      color:var(--gold2);
      border:1px solid rgba(139,94,0,.48);
      background:#fff6d9;
      border-radius:999px;
      padding:6px 10px;
      font-size:11px;
      font-weight:700;
      white-space:nowrap;
    }

    .charts-layout{
      display:grid;
      grid-template-columns:190px minmax(0,1fr);
      gap:8px;
      align-items:stretch;
    }

    .charts-panel{
      border:1px solid var(--line);
      border-radius:17px;
      background:var(--card);
      padding:9px;
      box-shadow:0 14px 34px var(--shadow);
      max-height:calc(100vh - 86px);
      overflow:auto;
    }

    .panel-label{
      display:block;
      color:var(--muted);
      font-size:10px;
      font-weight:700;
      text-transform:uppercase;
      letter-spacing:.06em;
      margin:4px 0 6px;
    }

    .charts-select{
      width:100%;
      background:var(--card2);
      color:var(--text);
      border:1px solid var(--line);
      border-radius:10px;
      padding:7px 8px;
      outline:none;
      font-size:11px;
      font-weight:500;
      margin-bottom:9px;
    }

    .group-title{
      grid-column:1/-1;
      margin:7px 0 2px;
      color:var(--muted);
      font-size:9px;
      font-weight:700;
      text-transform:uppercase;
      letter-spacing:.06em;
      opacity:1;
    }

    .quick-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:5px;
    }

    .quick-btn{
      appearance:none;
      border:1px solid var(--line);
      background:var(--card2);
      color:var(--text);
      border-radius:9px;
      padding:5px 4px;
      min-height:25px;
      font-size:10px;
      line-height:1.05;
      font-weight:400;
      cursor:pointer;
      transition:.14s ease;
      text-align:center;
    }

    .quick-btn:hover{
      transform:translateY(-1px);
      border-color:rgba(210,153,34,.55);
      background:rgba(210,153,34,.10);
      color:var(--text);
    }

    .quick-btn.active{
      border-color:rgba(210,153,34,.78);
      background:linear-gradient(180deg,rgba(210,153,34,.22),rgba(210,153,34,.08));
      color:var(--text);
    }

    .provider-copy{
      margin-top:10px;
      padding-top:9px;
      border-top:1px solid var(--line);
      color:var(--muted);
      font-size:10px;
      line-height:1.35;
    }

    .chart-card{
      overflow:hidden;
      min-height:calc(100vh - 92px);
      border:1px solid var(--line);
      border-radius:17px;
      background:var(--card);
      box-shadow:0 14px 38px var(--shadow);
    }

    .chart-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:8px;
      padding:4px 9px 3px;
      border-bottom:1px solid var(--line);
      min-height:28px;
    }

    .chart-title-row{
      display:flex;
      align-items:baseline;
      gap:7px;
      min-width:0;
      flex-wrap:wrap;
    }

    .chart-title{
      margin:0;
      font-size:13.5px;
      line-height:1;
      font-weight:650;
      white-space:nowrap;
    }

    .chart-subtitle{
      color:var(--muted);
      font-size:10px;
      line-height:1;
      font-weight:400;
      white-space:nowrap;
    }

    .chart-chip{
      color:var(--text);
      border:1px solid var(--line);
      background:var(--card2);
      padding:3px 7px;
      border-radius:999px;
      font-size:9.5px;
      font-weight:400;
      white-space:nowrap;
    }

    .tv-shell{
      height:calc(100vh - 150px);
      min-height:720px;
      padding:8px;
    }

    .tradingview-widget-container,
    .tradingview-widget-container__widget{
      width:100%;
      height:100%;
      min-height:720px;
    }

    @media(max-width:1050px){
      .charts-layout{
        grid-template-columns:1fr;
      }
      .charts-panel{
        max-height:none;
      }
      .quick-grid{
        grid-template-columns:repeat(4,1fr);
      }
      .tv-shell{
        height:650px;
      }
    }

    @media(max-width:700px){
      .charts-wrap{
        padding:8px;
      }
      .charts-hero{
        display:block;
      }
      .provider-pill{
        display:inline-flex;
        margin-top:8px;
      }
      .quick-grid{
        grid-template-columns:repeat(2,1fr);
      }
      .tv-shell{
        height:560px;
        min-height:560px;
      }
      .tradingview-widget-container,
      .tradingview-widget-container__widget{
        min-height:560px;
      }
    }

    .nav-row-break{
      flex-basis:100%;
      height:0;
    }

    .nav a[href="charts.html"]::before{
      content:"📈";
    }

    body.dark-mode{
      background:
        radial-gradient(circle at 12% 0%,rgba(210,153,34,.10),transparent 28rem),
        radial-gradient(circle at 92% 12%,rgba(88,166,255,.07),transparent 30rem),
        var(--bg);
    }

    body.dark-mode .charts-hero,
    body.dark-mode .charts-panel,
    body.dark-mode .chart-card{
      background:linear-gradient(180deg,var(--card2),var(--card));
    }

    body.dark-mode .provider-pill{
      color:var(--gold2);
      border-color:rgba(210,153,34,.45);
      background:rgba(210,153,34,.10);
    }

    body.dark-mode .quick-btn:hover,
    body.dark-mode .quick-btn.active{
      color:#fff;
    }

    body .psd-shared-header .social-pill.linkedin{opacity:1!important;visibility:visible!important;font-weight:900!important;text-shadow:none!important}
    body:not(.dark-mode) .psd-shared-header .social-pill.linkedin{color:#061522!important;background:#fff!important;border-color:#8da8bd!important}
    body.dark-mode .psd-shared-header .social-pill.linkedin{color:#fff!important}
  </style>
</head>

<body>

  <div id="site-header"></div>
  <script src="site-nav.js?v=1" defer></script>
  <script src="site-theme.js?v=1" defer></script>

  <main class="charts-wrap">
    <section class="charts-hero">
      <div>
        <h1>Market Charts</h1>
        <p>Embedded market charts for quick technical context beside Public Sentiment Dash research.</p>
      </div>
      <div class="provider-pill">Charts by TradingView</div>
    </section>

    <section class="charts-layout">
      <aside class="charts-panel">
        <div id="quickGrid" class="quick-grid"></div>

        <div class="provider-copy">
          Chart data is displayed through TradingView’s embedded widget. Attribution remains visible.
        </div>
      </aside>

      <section class="chart-card">
        <div class="chart-header">
          <div class="chart-title-row">
            <h2 id="chartTitle" class="chart-title">S&P 500</h2>
            <div id="chartSubtitle" class="chart-subtitle">AMEX:SPY · Daily</div>
          </div>
          <div class="chart-chip">TradingView</div>
        </div>

        <div id="tvShell" class="tv-shell"></div>
      </section>
    </section>
  </main>

  <script>
    const GROUPS = [
      {
        name: "Index ETFs",
        items: [
          { label:"S&P 500", short:"S&P", symbol:"AMEX:SPY" },
          { label:"Nasdaq 100", short:"Nasdaq", symbol:"NASDAQ:QQQ" },
          { label:"Dow Jones", short:"Dow", symbol:"AMEX:DIA" },
          { label:"Russell 2000", short:"Russell", symbol:"AMEX:IWM" },
          { label:"VIX", short:"VIX", symbol:"AMEX:VXX" },
          { label:"US Dollar Index", short:"DXY", symbol:"TVC:DXY" },
          { label:"20+ Year Treasury Bonds", short:"TLT", symbol:"NASDAQ:TLT" },
          { label:"Emerging Markets", short:"EEM", symbol:"AMEX:EEM" }
        ]
      },
      {
        name: "Forex",
        items: [
          { label:"EUR/USD", short:"EUR/USD", symbol:"OANDA:EURUSD" },
          { label:"GBP/USD", short:"GBP/USD", symbol:"OANDA:GBPUSD" },
          { label:"USD/JPY", short:"USD/JPY", symbol:"OANDA:USDJPY" },
          { label:"USD/CHF", short:"USD/CHF", symbol:"OANDA:USDCHF" },
          { label:"USD/CAD", short:"USD/CAD", symbol:"OANDA:USDCAD" },
          { label:"AUD/USD", short:"AUD/USD", symbol:"OANDA:AUDUSD" },
          { label:"NZD/USD", short:"NZD/USD", symbol:"OANDA:NZDUSD" },
          { label:"EUR/JPY", short:"EUR/JPY", symbol:"OANDA:EURJPY" }
        ]
      },
      {
        name: "Commodities",
        items: [
          { label:"Gold", short:"Gold", symbol:"AMEX:GLD" },
          { label:"Silver", short:"Silver", symbol:"AMEX:SLV" },
          { label:"Crude Oil WTI", short:"WTI", symbol:"AMEX:USO" },
          { label:"Natural Gas", short:"NatGas", symbol:"AMEX:UNG" }
        ]
      },
      {
        name: "Stocks",
        items: [
          { label:"Nvidia", short:"NVDA", symbol:"NASDAQ:NVDA" },
          { label:"Broadcom", short:"AVGO", symbol:"NASDAQ:AVGO" },
          { label:"AMD", short:"AMD", symbol:"NASDAQ:AMD" },
          { label:"Micron", short:"MU", symbol:"NASDAQ:MU" },
          { label:"Taiwan Semiconductor", short:"TSM", symbol:"NYSE:TSM" },
          { label:"ASML", short:"ASML", symbol:"NASDAQ:ASML" },
          { label:"Tesla", short:"TSLA", symbol:"NASDAQ:TSLA" },
          { label:"Apple", short:"AAPL", symbol:"NASDAQ:AAPL" },
          { label:"Microsoft", short:"MSFT", symbol:"NASDAQ:MSFT" },
          { label:"Alphabet", short:"GOOGL", symbol:"NASDAQ:GOOGL" },
          { label:"Amazon", short:"AMZN", symbol:"NASDAQ:AMZN" },
          { label:"Meta", short:"META", symbol:"NASDAQ:META" },
          { label:"Palantir", short:"PLTR", symbol:"NASDAQ:PLTR" },
          { label:"Oracle", short:"ORCL", symbol:"NYSE:ORCL" },
          { label:"Arm", short:"ARM", symbol:"NASDAQ:ARM" },
          { label:"Semiconductor ETF", short:"SMH", symbol:"NASDAQ:SMH" },
          { label:"AI ETF", short:"AIQ", symbol:"NASDAQ:AIQ" }
        ]
      },
      {
        name: "Crypto",
        items: [
          { label:"Bitcoin", short:"BTC", symbol:"BINANCE:BTCUSDT" },
          { label:"Ethereum", short:"ETH", symbol:"BINANCE:ETHUSDT" },
          { label:"Solana", short:"SOL", symbol:"BINANCE:SOLUSDT" },
          { label:"XRP", short:"XRP", symbol:"BINANCE:XRPUSDT" },
          { label:"BNB", short:"BNB", symbol:"BINANCE:BNBUSDT" },
          { label:"Dogecoin", short:"DOGE", symbol:"BINANCE:DOGEUSDT" },
          { label:"Cardano", short:"ADA", symbol:"BINANCE:ADAUSDT" },
          { label:"Chainlink", short:"LINK", symbol:"BINANCE:LINKUSDT" },
          { label:"Litecoin", short:"LTC", symbol:"BINANCE:LTCUSDT" },
          { label:"Avalanche", short:"AVAX", symbol:"BINANCE:AVAXUSDT" },
          { label:"Polkadot", short:"DOT", symbol:"BINANCE:DOTUSDT" },
          { label:"Bitcoin Cash", short:"BCH", symbol:"BINANCE:BCHUSDT" }
        ]
      }
    ];

    const DIRECT_LINK_CHARTS = [
      { label:"WTI Crude Oil Futures", short:"WTI", symbol:"NYMEX:CL1!" },
      { label:"Natural Gas Futures", short:"NatGas", symbol:"NYMEX:NG1!" },
      { label:"Brent Crude Oil Futures", short:"Brent", symbol:"NYMEX:BZ1!" },
      { label:"RBOB Gasoline Futures", short:"Gasoline", symbol:"NYMEX:RB1!" },
      { label:"NY Harbor ULSD Futures", short:"Heating", symbol:"NYMEX:HO1!" },
      { label:"Platinum Futures", short:"Platinum", symbol:"NYMEX:PL1!" },
      { label:"Palladium Futures", short:"Palladium", symbol:"NYMEX:PA1!" },
      { label:"Copper Futures", short:"Copper", symbol:"COMEX:HG1!" },
      { label:"Gold Miners ETF", short:"GDX", symbol:"AMEX:GDX" },
      { label:"S&P 500 E-mini Futures", short:"ES", symbol:"CME_MINI:ES1!" },
      { label:"Nasdaq 100 E-mini Futures", short:"NQ", symbol:"CME_MINI:NQ1!" },
      { label:"Dow Jones E-mini Futures", short:"YM", symbol:"CBOT_MINI:YM1!" },
      { label:"Russell 2000 E-mini Futures", short:"RTY", symbol:"CME_MINI:RTY1!" },
      { label:"CBOE Volatility Index", short:"VIX", symbol:"CBOE:VIX" },
      { label:"DAX Futures", short:"DAX", symbol:"EUREX:FDAX1!" },
      { label:"FTSE 100", short:"FTSE", symbol:"OANDA:UK100GBP" },
      { label:"Nikkei 225", short:"Nikkei", symbol:"OANDA:JP225USD" },
      { label:"Hang Seng", short:"HSI", symbol:"OANDA:HK33HKD" },
      { label:"Euro Stoxx 50 Futures", short:"Stoxx", symbol:"EUREX:FESX1!" },
      { label:"Official Trump / USDT", short:"TRUMP", symbol:"BINANCE:TRUMPUSDT" },
      { label:"World Liberty Financial / USDT", short:"WLFI", symbol:"BINANCE:WLFIUSDT" },
      { label:"Trump Media", short:"DJT", symbol:"NASDAQ:DJT" },
      { label:"Coinbase", short:"COIN", symbol:"NASDAQ:COIN" },
      { label:"Strategy / MicroStrategy", short:"MSTR", symbol:"NASDAQ:MSTR" },
      { label:"Aerospace & Defense ETF", short:"ITA", symbol:"CBOE:ITA" },
      { label:"Lockheed Martin", short:"LMT", symbol:"NYSE:LMT" },
      { label:"Rare Earth ETF", short:"REMX", symbol:"AMEX:REMX" },
      { label:"China Large-Cap ETF", short:"FXI", symbol:"AMEX:FXI" },
      { label:"Uranium ETF", short:"URA", symbol:"AMEX:URA" },
      { label:"GEO Group", short:"GEO", symbol:"NYSE:GEO" },
      { label:"TRON", short:"TRX", symbol:"BINANCE:TRXUSDT" },
      { label:"Hyperliquid", short:"HYPE", symbol:"KUCOIN:HYPEUSDT" },
      { label:"Sui", short:"SUI", symbol:"BINANCE:SUIUSDT" },
      { label:"Hedera", short:"HBAR", symbol:"BINANCE:HBARUSDT" },
      { label:"Uniswap", short:"UNI", symbol:"BINANCE:UNIUSDT" },
      { label:"Shiba Inu", short:"SHIB", symbol:"BINANCE:SHIBUSDT" },
      { label:"EUR/GBP", short:"EURGBP", symbol:"OANDA:EURGBP" },
      { label:"GBP/JPY", short:"GBPJPY", symbol:"OANDA:GBPJPY" },
      { label:"USD/CNH", short:"USDCNH", symbol:"OANDA:USDCNH" },
      { label:"USD/MXN", short:"USDMXN", symbol:"OANDA:USDMXN" },
      { label:"USD/HKD", short:"USDHKD", symbol:"OANDA:USDHKD" },
      { label:"USD/SGD", short:"USDSGD", symbol:"OANDA:USDSGD" },
    ];

    const CHARTS = [...GROUPS.flatMap(group => group.items), ...DIRECT_LINK_CHARTS];

    const INTERVAL_LABELS = {
      "15":"15m",
      "30":"30m",
      "60":"1H",
      "240":"4H",
      "D":"Daily",
      "W":"Weekly",
      "M":"Monthly"
    };

    const quickGrid = document.getElementById("quickGrid");
    const chartTitle = document.getElementById("chartTitle");
    const chartSubtitle = document.getElementById("chartSubtitle");
    const tvShell = document.getElementById("tvShell");

    const requestedSymbol = new URLSearchParams(window.location.search).get("symbol");
    let currentSymbol = CHARTS.some(item=>item.symbol===requestedSymbol) ? requestedSymbol : "AMEX:SPY";

    function findChart(symbol){
      return CHARTS.find(item => item.symbol === symbol) || CHARTS[0];
    }

    function initControls(){
      GROUPS.forEach(group => {
        const groupTitle = document.createElement("div");
        groupTitle.className = "group-title";
        groupTitle.textContent = group.name;
        quickGrid.appendChild(groupTitle);

        group.items.forEach(item => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "quick-btn" + (item.symbol === currentSymbol ? " active" : "");
          btn.textContent = item.short;
          btn.dataset.symbol = item.symbol;
          btn.addEventListener("click", () => selectChart(item.symbol));
          quickGrid.appendChild(btn);
        });
      });
    }

    function selectChart(symbol){
      currentSymbol = symbol;

      document.querySelectorAll(".quick-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.symbol === symbol);
      });

      renderChart();
    }

    function renderChart(){
      const item = findChart(currentSymbol);
      const interval = "D";

      chartTitle.textContent = item.label;
      chartSubtitle.textContent = item.symbol + " · " + (INTERVAL_LABELS[interval] || interval);

      tvShell.innerHTML = "";

      const container = document.createElement("div");
      container.className = "tradingview-widget-container";

      const widget = document.createElement("div");
      widget.className = "tradingview-widget-container__widget";

      const script = document.createElement("script");
      script.type = "text/javascript";
      script.src = "https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js";
      script.async = true;
      const dark = document.body.classList.contains("dark-mode");
      script.textContent = JSON.stringify({
        autosize: true,
        symbol: item.symbol,
        interval: interval,
        timezone: "Etc/UTC",
        theme: dark ? "dark" : "light",
        style: "1",
        locale: "en",
        allow_symbol_change: false,
        calendar: false,
        support_host: "https://www.tradingview.com",
        hide_side_toolbar: true,
        details: false,
        hotlist: false,
        withdateranges: true,
        hide_legend: false,
        save_image: false,
        studies: [],
        backgroundColor: dark ? "rgba(13, 19, 29, 1)" : "rgba(255, 255, 255, 1)",
        gridColor: dark ? "rgba(148, 163, 184, 0.12)" : "rgba(71, 85, 105, 0.16)"
      });

      container.appendChild(widget);
      container.appendChild(script);
      tvShell.appendChild(container);
    }

    initControls();
    renderChart();
    window.addEventListener("psd-theme-change", renderChart);
  </script>
  <div id="site-footer"></div>
  <script src="site-footer.js?v=1" defer></script>
  <script src="vote-widget.js?v=19" defer></script>
</body>
</html>
