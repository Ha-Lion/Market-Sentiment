<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compact Watchlist — Lab v94.2.6 | Public Sentiment Dash</title>
  <meta name="description" content="Private personalized watchlist for a Public Sentiment Dash member.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="stylesheet" href="site.css">
  <link rel="stylesheet" href="watchlist.css?v=20260809-chart5">
  <link rel="stylesheet" href="site-theme.css?v=20">

  <style>
    body{
      min-height:100vh;
    }

    /* Embedded as a single dashboard panel; instrument cards are the 15 child tiles. */
    html,body{height:auto;min-height:100%;margin:0}
    main.page.watchlist-page{
      width:auto;
      max-width:none;
      margin:0;
      padding:8px;
      min-height:100vh;
      display:flex;
      flex-direction:column;
    }

    #watchlist-grid{
      flex:0 0 auto;
    }

    body:not(.dark-mode){--bg:var(--theme-bg);--panel:var(--theme-card);--card:var(--theme-card-2);--line:var(--theme-line);--text:var(--theme-text);--soft:var(--theme-soft);--muted:var(--theme-muted);--blue:var(--theme-blue)}
    body:not(.dark-mode) .panel{background:var(--theme-card);box-shadow:0 12px 28px rgba(25,50,72,.13)}
    body:not(.dark-mode) .page-chip{background:var(--theme-gold-soft);color:#523700;border-color:#a97200}
    body:not(.dark-mode) .watchlist-metric,body:not(.dark-mode) .watchlist-chip{background:var(--theme-card-2);color:#061522}
    body:not(.dark-mode) .watchlist-metric strong,body:not(.dark-mode) .watchlist-card h2{color:#061522}
    body:not(.dark-mode) .watchlist-symbol{color:#6b4700}
    body:not(.dark-mode) .watchlist-modal-card{background:#f8fbfe;color:#061522}
    body:not(.dark-mode) .watchlist-modal-head{background:#fff}
    body:not(.dark-mode) .watchlist-modal-close,body:not(.dark-mode) .watchlist-chart-tool{background:#eef4f9;color:#061522}
    body:not(.dark-mode) .watchlist-news-item{background:#fff}
    body:not(.dark-mode) .watchlist-news-title{color:#061522}
    body:not(.dark-mode) .watchlist-comparison,
    body:not(.dark-mode) .watchlist-card-actions a,
    body:not(.dark-mode) .watchlist-card-actions button{
      background:#fff7df;
      color:#563800;
      border-color:#9a6500;
      text-shadow:none;
    }
    body:not(.dark-mode) .watchlist-comparison:hover,
    body:not(.dark-mode) .watchlist-card-actions a:hover,
    body:not(.dark-mode) .watchlist-card-actions button:hover{
      background:#f5df9c;
      color:#2f1e00;
      border-color:#6b4700;
    }
    body:not(.dark-mode) .psd-glossary-popover{
      background:#fff;
      color:#061522;
      border-color:#7894aa;
      box-shadow:0 14px 34px rgba(25,50,72,.24);
    }
    body:not(.dark-mode) .psd-glossary-title{color:#061522}
    body:not(.dark-mode) .psd-glossary-text{color:#102a3d}
    body:not(.dark-mode) .psd-glossary-close{color:#233f54}
    body:not(.dark-mode) .psd-glossary-close:hover{color:#000}
    /* Reduce wasted space in a nested dashboard without dropping any original actions. */
    .watchlist-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;}
    @media(max-width:1460px){.watchlist-grid{grid-template-columns:repeat(3,minmax(0,1fr));}}
    @media(max-width:1000px){.watchlist-grid{grid-template-columns:repeat(2,minmax(0,1fr));}}
    @media(max-width:640px){.watchlist-grid{grid-template-columns:1fr;}}
    .psd-compact-sr{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
    .psd-compact-empty-hint{padding:22px 14px;color:var(--muted);font-size:13px;margin:0;grid-column:1/-1;background:transparent;border:0;box-shadow:none}
    /* Only instrument cards are drawn in the embedded dashboard tile. */
    /* The dashboard itself owns the tile border, title bar, drag and resize handles. */
    main.page.watchlist-page{padding:0!important;min-height:100%!important}
    #watchlist-grid{display:block!important;margin:0!important;padding:0!important}
    .watchlist-card{padding-top:43px!important;min-width:0!important;min-height:100%!important;margin:0!important;border:0!important;border-radius:0!important;box-shadow:none!important;background:transparent!important;padding:13px!important}
    .watchlist-card .watchlist-comparison{white-space:nowrap}
    body{background:transparent!important}
    html[data-psd-theme="dark"] body,.dark-mode body{background:transparent!important}
    html[data-psd-theme="light"] .watchlist-card{background:transparent!important}
    body.psd-single-popup #watchlist-grid{display:none!important}
    body.psd-single-popup main.page.watchlist-page{padding:0!important}
    body.psd-single-popup .watchlist-modal{z-index:5000}

    body{overflow-x:hidden}
    html,body{background:transparent!important;color:var(--theme-text)!important}
    body.dark-mode .watchlist-card{color:#fff!important}
    body:not(.dark-mode) .watchlist-card{color:#061522!important}
    .watchlist-card{height:auto!important}
  </style>
</head>
<body>
  <script>
  (function(){
    const query=new URLSearchParams(location.search);
    if(!query.has('asset')||query.has('popup'))return;
    function syncTheme(theme){
      if(theme!=='dark'&&theme!=='light')return;
      document.body.classList.toggle('dark-mode',theme==='dark');
      document.body.classList.toggle('light-mode',theme==='light');
      document.documentElement.dataset.theme=theme;
      document.documentElement.dataset.psdTheme=theme;
      document.documentElement.style.colorScheme=theme;
    }
    window.addEventListener('message',function(event){
      if(event.origin!==location.origin||event.source!==window.parent)return;
      if(event.data?.type==='psd-compact-theme-sync')syncTheme(event.data.theme);
    });
    document.addEventListener('DOMContentLoaded',function(){
      window.parent.postMessage({type:'psd-compact-theme-request'},location.origin);
    });
  })();
  </script>
  <script src="site-theme.js?v=20" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="supabase-client.js?v=6" defer></script>

  <main class="page watchlist-page">
    <div id="watchlist-status" class="watchlist-status psd-compact-sr" role="status" aria-live="polite">Loading your watchlist…</div>

    <section id="watchlist-grid" class="watchlist-grid" aria-live="polite"></section>

    <div id="watchlist-modal" class="watchlist-modal" role="dialog" aria-modal="true" aria-labelledby="watchlist-modal-title">
      <section class="watchlist-modal-card">
        <div class="watchlist-modal-head">
          <h2 id="watchlist-modal-title">Instrument Details</h2>
          <button id="watchlist-modal-close" class="watchlist-modal-close" type="button" aria-label="Close popup">×</button>
        </div>
        <div id="watchlist-modal-body" class="watchlist-modal-body"></div>
      </section>
    </div>
  </main>



  <!--
    Load Lightweight Charts only when a user actually opens Comparison.
    Keeping this third-party CDN request out of the initial page-load path
    prevents it from holding the browser's loading indicator open.
  -->
  <script>
    (function(){
      "use strict";

      var chartLibraryPromise=null;

      function loadWatchlistChartLibrary(){
        if(window.LightweightCharts) return Promise.resolve(window.LightweightCharts);
        if(chartLibraryPromise) return chartLibraryPromise;

        chartLibraryPromise=new Promise(function(resolve,reject){
          var script=document.createElement("script");
          script.src="https://unpkg.com/lightweight-charts@5.2.0/dist/lightweight-charts.standalone.production.js";
          script.async=true;

          script.onload=function(){
            if(window.LightweightCharts){
              resolve(window.LightweightCharts);
            }else{
              chartLibraryPromise=null;
              reject(new Error("Interactive chart library did not initialize."));
            }
          };

          script.onerror=function(){
            chartLibraryPromise=null;
            reject(new Error("Interactive chart library could not load."));
          };

          document.head.appendChild(script);
        });

        return chartLibraryPromise;
      }

      document.addEventListener("click",function(event){
        var button=event.target && event.target.closest
          ? event.target.closest(".watchlist-comparison")
          : null;

        if(!button || window.LightweightCharts || button.dataset.psdChartReady==="true"){
          return;
        }

        event.preventDefault();
        event.stopImmediatePropagation();

        var originalText=button.textContent;
        button.disabled=true;
        button.textContent="Loading…";

        loadWatchlistChartLibrary()
          .then(function(){
            button.dataset.psdChartReady="true";
            button.disabled=false;
            button.textContent=originalText;
            button.click();
          })
          .catch(function(error){
            console.error("Watchlist chart library load failed:",error);
            button.disabled=false;
            button.textContent=originalText;
            window.alert("Interactive chart could not load right now. Please try again.");
          });
      },true);
    })();
  </script>

  <!-- v94.2.5: Keep Economic Calendar usable from a small independent card. -->
  <script>
   (function(){
     const p=new URLSearchParams(location.search);
     if(!p.has('asset'))return;
     if(!p.has('popup'))document.addEventListener('click',function(e){
       if(!e.target.closest('.watchlist-economic-button'))return;
       e.preventDefault();e.stopImmediatePropagation();
       window.parent.postMessage({type:'psd-compact-card-lab',action:'open-modal',popup:'calendar'},location.origin);
     },true);
     if(p.get('popup')==='calendar'){
       const grid=document.getElementById('watchlist-grid');
       const obs=new MutationObserver(function(){
         const button=grid.querySelector('.watchlist-economic-button');
         if(button){obs.disconnect();button.click();}
       });
       obs.observe(grid,{childList:true,subtree:true});
       window.addEventListener('pagehide',()=>obs.disconnect(),{once:true});
     }
   })();
  </script>

  <script src="compact-watchlist-lab.js?v=94.2.5" defer></script>
  <script src="watchlist-economic-events.js?v=3" defer></script>

  <script src="glossary.js?v=3" defer></script>

  <!-- v94.2.3: Instrument selection and member import moved into parent tile settings. -->
</body>
