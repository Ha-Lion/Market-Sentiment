<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anonymous Activity Report | Public Sentiment Dash</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="stylesheet" href="site.css">
  <link rel="stylesheet" href="activity-report.css">
</head>
<body>
  <div id="site-header"></div>
  <script src="site-nav.js?v=6"></script>

  <main class="page activity-page">
    <section class="panel">
      <div class="activity-heading">
        <div>
          <div class="page-chip">Owner Report</div>
          <h1>Anonymous Member vs Guest Activity</h1>
          <p>Aggregate counts only. No names, emails, user IDs, passwords, typed text, watchlists, or alert contents appear here.</p>
        </div>
        <a class="activity-account-link" href="account.html">Back to Account</a>
      </div>

      <div class="activity-filters">
        <label>Start date<input id="activity-start" type="date"></label>
        <label>End date<input id="activity-end" type="date"></label>
        <button id="activity-refresh" type="button">Refresh</button>
        <button id="activity-download" type="button">Download CSV</button>
      </div>
      <div id="activity-status" class="activity-status" role="status"></div>
    </section>

    <section class="activity-summary" aria-label="Activity summary">
      <article class="panel"><span>Total Activities</span><strong id="summary-total">0</strong></article>
      <article class="panel"><span>Member Activities</span><strong id="summary-member">0</strong></article>
      <article class="panel"><span>Guest Activities</span><strong id="summary-guest">0</strong></article>
      <article class="panel"><span>Most Used Page</span><strong id="summary-page">—</strong></article>
    </section>

    <section class="panel activity-table-panel">
      <div class="activity-table-wrap">
        <table>
          <thead>
            <tr>
              <th>Date</th><th>Type</th><th>Page</th><th>Activity</th><th>Feature</th><th>Count</th>
            </tr>
          </thead>
          <tbody id="activity-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js?v=6"></script>
  <script src="activity-report.js?v=1"></script>
</body>
</html>
