name: PSD Kaggle to Calendar Lab - research forecast sync

on:
  workflow_dispatch:
  schedule:
    - cron: '17 8,20 * * *'

permissions:
  contents: write

concurrency:
  group: psd-kaggle-forecast-lab-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Kaggle token configuration
        id: auth
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          if [ -n "$KAGGLE_API_TOKEN" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'Awaiting a GitHub Actions secret named KAGGLE_API_TOKEN.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install Kaggle CLI
        if: steps.auth.outputs.configured == 'true'
        run: python -m pip install --disable-pip-version-check kaggle
      - name: Download private Kaggle dataset
        if: steps.auth.outputs.configured == 'true'
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/psd_private"
          kaggle datasets download -d yehudakohenkadosh/psd-calendar-lab-forecast-feed-v2-3 -p "$RUNNER_TEMP/psd_private" --unzip
      - name: Strictly validate and sanitize public research feed
        if: steps.auth.outputs.configured == 'true'
        run: |
          python scripts/psd_publish_kaggle_lab.py --dataset-dir "$RUNNER_TEMP/psd_private" --output psd-forecast-lab-feed.json
      - name: Update only the forecast Lab JSON
        if: steps.auth.outputs.configured == 'true'
        shell: bash
        run: |
          git add -- psd-forecast-lab-feed.json
          if git diff --cached --quiet -- psd-forecast-lab-feed.json; then
            echo 'No forecast changes; latest feed already published.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git -c user.name='PSD Calendar Lab Bot' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'lab: refresh sanitized Kaggle research forecasts' --only -- psd-forecast-lab-feed.json
          git push origin HEAD:main
          echo 'Published sanitized research values to public GitHub main. No production calendar files modified.' >> "$GITHUB_STEP_SUMMARY"
