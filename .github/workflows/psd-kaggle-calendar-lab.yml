name: PSD Kaggle Forecast Lab Sync (manual research validation)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Kaggle CLI
        run: python -m pip install kaggle==1.7.4.5
      - name: Download private Kaggle dataset
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          test -n "$KAGGLE_USERNAME" && test -n "$KAGGLE_KEY" || { echo "Kaggle credentials not configured"; exit 1; }
          mkdir -p "$RUNNER_TEMP/psd_private"
          kaggle datasets download -d yehudakohenkadosh/psd-calendar-lab-forecast-feed-v2-3 -p "$RUNNER_TEMP/psd_private" --unzip
      - name: Validate and sanitize (no publish)
        run: |
          python scripts/psd_publish_kaggle_lab.py --dataset-dir "$RUNNER_TEMP/psd_private" --output "$RUNNER_TEMP/psd-forecast-lab-feed.json"
          echo "Validation complete. No public upload or repository commit performed."
