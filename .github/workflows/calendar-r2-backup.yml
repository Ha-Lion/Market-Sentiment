name: Calendar database backup to Cloudflare R2
on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * *'
permissions:
  contents: read
concurrency:
  group: calendar-r2-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CALENDAR_DATABASE_URL: ${{ secrets.CALENDAR_BACKUP_DATABASE_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.CALENDAR_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CALENDAR_R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ACCOUNT_ID: ${{ secrets.CALENDAR_R2_ACCOUNT_ID }}
      R2_BUCKET: publicsentimentdash-calendar-backup
      PGSSLMODE: require
      PGCONNECT_TIMEOUT: '15'
    steps:
      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in CALENDAR_DATABASE_URL AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY R2_ACCOUNT_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing secret for $name"
              exit 1
            fi
          done
      - name: Install PostgreSQL client and AWS CLI
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client awscli
      - name: Export calendar tables without modifying database
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backup
          stamp="$(date -u +'%Y-%m-%dT%H-%M-%SZ')"
          echo "BACKUP_STAMP=$stamp" >> "$GITHUB_ENV"
          pg_dump --dbname="$CALENDAR_DATABASE_URL" --format=custom --compress=6 \
            --no-owner --no-privileges \
            --table='public.econ_*' \
            --table='public.calendar_*' \
            --file="backup/calendar-$stamp.dump"
          test -s "backup/calendar-$stamp.dump"
          (cd backup && sha256sum "calendar-$stamp.dump" > "calendar-$stamp.dump.sha256")
      - name: Upload and verify Cloudflare R2 objects
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          prefix="calendar/$(date -u +'%Y/%m/%d')"
          file="calendar-${BACKUP_STAMP}.dump"
          aws --endpoint-url "$endpoint" s3 cp "backup/$file" "s3://$R2_BUCKET/$prefix/$file" --only-show-errors
          aws --endpoint-url "$endpoint" s3 cp "backup/$file.sha256" "s3://$R2_BUCKET/$prefix/$file.sha256" --only-show-errors
          aws --endpoint-url "$endpoint" s3api head-object \
            --bucket "$R2_BUCKET" --key "$prefix/$file" \
            --query '{size:ContentLength,etag:ETag}' --output json
          echo "Backup uploaded and object existence verified."
