<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Public Sentiment Dash</title>
  <meta name="description" content="Sign in or create a free Public Sentiment Dash account.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="stylesheet" href="site.css">
  <link rel="stylesheet" href="account.css">
  <link rel="stylesheet" href="site-theme.css">
  <style>
    body:not(.dark-mode){--bg:var(--theme-bg);--panel:var(--theme-card);--card:var(--theme-card-2);--line:var(--theme-line);--text:var(--theme-text);--soft:var(--theme-soft);--muted:var(--theme-muted);--blue:var(--theme-blue)}
    body:not(.dark-mode) .panel{background:var(--theme-card);box-shadow:0 12px 28px rgba(25,50,72,.13)}
    body:not(.dark-mode) .page-chip{background:var(--theme-gold-soft);color:#523700;border-color:#a97200}
    body:not(.dark-mode) .auth-tab{background:var(--theme-card-2);color:#061522}
    body:not(.dark-mode) .auth-tab.active{background:#f0c65a;color:#120c00}
    body:not(.dark-mode) .psd-field label,body:not(.dark-mode) .checkbox-row{color:#061522}
    body:not(.dark-mode) .psd-input{background:#fff;color:#061522;border-color:#8da8bd}
    body .psd-shared-header .social-pill.linkedin{opacity:1!important;visibility:visible!important;font-weight:900!important;text-shadow:none!important}
    body:not(.dark-mode) .psd-shared-header .social-pill.linkedin{color:#061522!important;background:#fff!important;border-color:#8da8bd!important}
    body.dark-mode .psd-shared-header .social-pill.linkedin{color:#fff!important}
    .auth-shell{width:auto;max-width:none;margin:0;padding:14px;min-height:calc(100vh - 220px)}
  </style>
</head>
<body>
  <div id="site-header"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="supabase-client.js?v=6" defer></script>
  <script src="site-nav.js?v=1" defer></script>
  <script src="site-theme.js?v=1" defer></script>

  <main class="page auth-shell">
    <section class="panel auth-card">
      <div class="page-chip">Free Account</div>
      <h1 id="auth-title">Your Market Preferences, Everywhere</h1>
      <p>Use one account for the website and future Apple and Android apps.</p>

      <div class="auth-tabs" id="auth-tabs" role="tablist" aria-label="Account actions">
        <button class="auth-tab active" type="button" data-panel="signin-panel">Sign In</button>
        <button class="auth-tab" type="button" data-panel="signup-panel">Create Account</button>
        <button class="auth-tab" type="button" data-panel="reset-panel">Reset Password</button>
      </div>

      <section id="signin-panel" class="auth-panel">
        <form id="signin-form" class="psd-form">
          <div class="psd-field">
            <label for="signin-identifier">Username or Email</label>
            <input class="psd-input" id="signin-identifier" name="username" type="text" autocomplete="username" required>
          </div>
          <div class="psd-field">
            <label for="signin-password">Password</label>
            <input class="psd-input" id="signin-password" name="password" type="password" autocomplete="current-password" minlength="8" required>
          </div>
          <label class="checkbox-row">
            <input id="signin-remember" type="checkbox" checked>
            <span>Remember me on this device</span>
          </label>
          <button class="psd-button" type="submit">Sign In</button>
        </form>
      </section>

      <section id="signup-panel" class="auth-panel" hidden>
        <form id="signup-form" class="psd-form">
          <div class="psd-field">
            <label for="signup-username">Username</label>
            <input class="psd-input" id="signup-username" name="new-username" type="text" autocomplete="username" minlength="3" maxlength="30" pattern="[a-z0-9_]{3,30}" required>
            <span class="psd-help">Use 3–30 lowercase letters, numbers, or underscores.</span>
          </div>
          <div class="psd-field">
            <label for="signup-email">Email</label>
            <input class="psd-input" id="signup-email" name="email" type="email" autocomplete="email" required>
          </div>
          <div class="psd-field">
            <label for="signup-password">Password</label>
            <input class="psd-input" id="signup-password" name="new-password" type="password" autocomplete="new-password" minlength="8" required>
          </div>
          <label class="checkbox-row">
            <input id="signup-agree" type="checkbox" required>
            <span>I agree to the <a href="terms.html">Terms</a> and <a href="privacy.html">Privacy Policy</a>.</span>
          </label>
          <button class="psd-button" type="submit">Create Free Account</button>
        </form>
      </section>

      <section id="reset-panel" class="auth-panel" hidden>
        <form id="reset-request-form" class="psd-form">
          <div class="psd-field">
            <label for="reset-email">Email</label>
            <input class="psd-input" id="reset-email" type="email" autocomplete="email" required>
          </div>
          <button class="psd-button" type="submit">Send Reset Email</button>
        </form>
      </section>

      <section id="recovery-panel" class="auth-panel" hidden>
        <h2>Choose a New Password</h2>
        <form id="recovery-form" class="psd-form">
          <div class="psd-field">
            <label for="new-password">New password</label>
            <input class="psd-input" id="new-password" type="password" autocomplete="new-password" minlength="8" required>
          </div>
          <button class="psd-button" type="submit">Update Password</button>
        </form>
      </section>

      <div id="auth-status" class="psd-status" role="status" aria-live="polite"></div>
      <p class="psd-help">Email confirmation is required before first sign-in.</p>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="site-footer.js?v=1" defer></script>
  <script src="auth-account.js?v=6" defer></script>
  <script src="vote-widget.js?v=19" defer></script>
</body>
</html>
